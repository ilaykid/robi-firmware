name: Build Robi firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  XIAOZHI_TAG: v2.5.2
  ROBI_VERSION: 2.5.4

jobs:
  build:
    name: Robi (${{ matrix.wake }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        wake: [heyrobby, hiesp]
    steps:
      - uses: actions/checkout@v4

      - name: Get xiaozhi-esp32 ${{ env.XIAOZHI_TAG }}
        shell: bash
        run: git clone --depth 1 --branch "$XIAOZHI_TAG" https://github.com/78/xiaozhi-esp32 fw

      - name: Patch for Robi (Hebrew, RTL, font, faces, wake word)
        shell: bash
        run: python3 scripts/patch_xiaozhi.py fw ${{ matrix.wake }}

      - name: Build
        shell: bash
        env:
          ROBI_TEXT_FONT: ${{ github.workspace }}/assets/font_noto_sans_common_30_4.bin
          ROBI_EMOJI_DIR: ${{ github.workspace }}/assets/faces
        run: |
          source "$IDF_PATH/export.sh"
          cd fw
          WAKE_ARGS=()
          if [[ "${{ matrix.wake }}" == "hiesp" ]]; then WAKE_ARGS=(--wake-word wn9_hiesp); fi
          python scripts/build.py waveshare/esp32-s3-touch-amoled-1.75 \
            --name esp32-s3-touch-amoled-1.75 --language he-IL "${WAKE_ARGS[@]}"
          echo "--- checks ---"
          grep -E "CONFIG_USE_DEVICE_AEC|CONFIG_LANGUAGE_HE_IL|CONFIG_LV_USE_BIDI|CONFIG_USE_CUSTOM_WAKE_WORD|CONFIG_CUSTOM_WAKE_WORD=|CONFIG_SR_WN_WN9_HIESP|CONFIG_SR_MN_EN" build/../sdkconfig || true
          ls -la build/merged-binary.bin build/xiaozhi.bin build/generated_assets.bin
          # app must fit an OTA slot (0x3f0000), assets the 8 MB assets partition
          test $(stat -c %s build/xiaozhi.bin) -lt $((0x3f0000))
          test $(stat -c %s build/generated_assets.bin) -lt $((8*1024*1024))
          # turn-based listening: device AEC must be off
          ! grep -q "^CONFIG_USE_DEVICE_AEC=y" sdkconfig
          mkdir -p ../out
          cp build/merged-binary.bin ../out/robi-full-${{ matrix.wake }}.bin
          cp build/xiaozhi.bin ../out/esp32-s3-touch-amoled-1.75_${ROBI_VERSION}.bin
          cp build/generated_assets.bin ../out/robi-assets-${{ matrix.wake }}.bin

      - uses: actions/upload-artifact@v4
        with:
          name: robi-firmware-${{ matrix.wake }}
          path: out/
          if-no-files-found: error

  publish:
    name: Publish binaries to the 'builds' branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: false
      - name: Push to builds branch
        shell: bash
        run: |
          cd out
          mkdir -p heyrobby hiesp
          mv robi-firmware-heyrobby/* heyrobby/ && mv robi-firmware-hiesp/* hiesp/
          rmdir robi-firmware-heyrobby robi-firmware-hiesp
          sha256sum */*.bin > SHA256SUMS
          echo "Built from ${GITHUB_SHA}" > README.md
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Binaries from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds
